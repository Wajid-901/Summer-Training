<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal CSS</title>
    <style>
      /* TagName{
                    CSS Property;
          } */

      h1 {
        color: red;
        text-align: center;
      }

      p {
        background-color: yellow;
      }

      button {
        background-color: red;
        color: white;
      }

      div {
        background-color: bisque;
        color: blue;
      }
    </style>
  </head>
  <body>
    <!-- Internal CSS - Inside HTML using style as Tag under head section 
    Good for Small Projects 
    -->
    <h1>Welcome To CSS</h1>

    <p>This is First Paragaph</p>
    <p>This is Second Paragapg</p>

    <div>
      <h2>CSS Types</h2>
    </div>

    <button>Log In</button>
  </body>
</html>
