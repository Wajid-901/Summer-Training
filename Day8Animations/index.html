<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            animation-name: changeColor;
            animation-duration: 5s;
            animation-iteration-count: infinite;

        }

        /* @keyframes changeColor{

            from{background-color: red;}


             to{background-color: blue;}
        } */

         /* @keyframes changeColor{

           0% {background-color: red;}

           25% {background-color: blue;}

           50% {background-color: yellow;}

           75% {background-color: aqua;}

           100% {background-color: brown;}
        } */

         @keyframes changeColor{

           0% {transform: translateX(0);        background-color: red;}

          

           50% { transform: translateY(200px);  background-color: yellow;}

          

           100% { transform: translateX(0);     background-color: brown;}
        }
    </style>
</head>
<body>
    <div class="box"></div>

    <strong>Animation Effect Goes Back To Original Form After Completing</strong>
</body>
</html>
