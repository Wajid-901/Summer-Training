<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Keywords - CodeWord of Programming Lang

        //Variable - It is Box to store Value/Data - One Data at a Time

        // let keyword - Which Help us To create Variable

        //Synatx - VariableType VariableName(Box) = Data/Value  which you want to store

        let username = "Suresh"  //"Text"

        let phoneNo =  123456789  //Number Directly

        phoneNo = 99999999 

        console.log(phoneNo)
        console.log(username)


        // const keyword - Fixed Cannot Change

        const appName = "Whatsapp"

        console.log(appName)
    </script>
</body>
</html>
