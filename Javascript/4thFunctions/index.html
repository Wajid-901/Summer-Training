<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Function - Help us To do a Specific Task


        function Greet(){
            //Body - Instruction/Task
            console.log("Good Eveing User")
        }

        Greet()  //Calling The Function


        //Function with Parameter (paramter/argument/Duumy Data )

        function greeting(name){
            console.log(" Good eveing " + name)
        }

        greeting("Aaditi")

        //Function withh return

        function TotalBill(price , quanity){
           
            return    price * quanity        //To give Something Backe

        }


        let result =  TotalBill(100,2)

        console.log(result)


        //Arrow Function  => Logic in one single ine
         let xyz =   ()=> {
            console.log("Hello guys I am Arrow Function ")
        }

        xyz()   //Calling the Arrow function using VariableName

    </script>
</body>
</html>
