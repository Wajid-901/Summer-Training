<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

      //Operators- Help us to Action on Data

      //1. Arthmetic Op - + , - , / , * , %

      console.log(10+5)

      console.log(10-5)

      console.log(10/5)

      console.log(10*5)

      //% - REMAINDER 

      console.log(13%2)   //1
      console.log(10%5)   //0

      //Left < Right- Left Number
      console.log(2%13)   //2
      console.log(1%8)    //1


      //Assigment Op- Help us to assign value =

      let score = 10

      score+=5

      console.log(score)


      //Relational/Comaprison Operator- Boolean Type
      console.log(12 > 3)    //true
      console.log(11 < 15)  //true

      console.log(10<=10)  //true

      console.log(5>=5)

      // == : I will Only Comapre Value
         
      console.log(100 == "100")


      // === I will Comapre value and Data Type as well
      console.log(100 === "100")



      //Logical Op - AND , OR , !

      // AND && -> When BOTH condition is TRUE Then OUTPUT is True
      let isMember = true

      let TotalBill = 1000

      console.log(  isMember && TotalBill > 500 )


      // OR - || - If Only One Condition is True Then Output is True

      let LoginStatus = true

      let NetflixSub = false

      console.log(" Access To Use Netflix " , LoginStatus || NetflixSub  )


      //! - Flip / Opposite Value

      let PaymentSStaus = false

      console.log(!PaymentSStaus)



    </script>    
</body>
</html>
