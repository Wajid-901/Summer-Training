<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //Loop - Task Repetion

      //Condition True Loop Starts , Condition False Loop Stops

      //Print Numbers 1 to 10 in console
      // console.log(1)
      // console.log(2)  ... 10 Times   ---- Wrong Method

      //1. for(start point;ending/condition;++/--)          -for Loop -Start Point and Ending
      //Print Number 1 to 10

      for (let i = 1; i <= 10; i++) {
        console.log(`The Number Value is ${i} `);
      }

      //print Number 10 to 1

      for (let j = 10; j >= 1; j--) {
        console.log(`The Number Value is ${j} `);
      }

      //While(Condition True)

      let count = 1;

      while (count <= 5) {
        console.log("Hello I am while Loop");
        count++;
      }

      // Do While Loop
      let number = 7;

      do {
        console.log("Good Evening");
      } while (number < 5);
    </script>
  </body>
</html>
