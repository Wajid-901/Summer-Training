<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // Math Object

      console.log(Math.SQRT2);

      console.log(Math.PI);

      console.log(Math.random());

      console.log(Math.sqrt(25));

      console.log(Math.pow(2, 4));

      console.log(Math.floor(5.8)); //floor - It means it removes decimal Number

      console.log(Math.ceil(5.1)); //ceil Means Go To Next Highes Number

      console.log(Math.round(2.4)); //round If Number < 0.5 --Remove Decimal

      console.log(Math.round(2.5)); //if Number >=0.5 --> Next Higest Number
      console.log(Math.round(2.6));
    </script>
  </body>
</html>
