<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
        }

        p.ex1{
            display: none;
        }

        p.ex2{
            display: block;
            background-color: palegoldenrod;
        }

        p.ex3{
            display: inline;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Display :  None</h1>

    <div>
        Here Display None Means Nothing To Display
        <p class="ex1">Hello Display None</p>
    </div>

    <h1>Display :  Block</h1>

    <div>
        Here Display Block Means - Block Level Eleemtn- 100% Width of space
        <p class="ex2">Hello Display Block</p>
    </div>

    <h1>Display :  Inline</h1>

    <div>
        Here Display Inline Means Like SPan- Required Amount of Width
        <p class="ex3">Hello Display Inline</p>
    </div>

</body>
</html>
