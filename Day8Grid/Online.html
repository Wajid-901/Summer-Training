<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }
 
          .ecom{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 30px;
          }

        


        .product{
         
            text-align: center;
            background-color: rgb(237, 187, 187);
          
            box-sizing: border-box;
            border: 1px solid brown;
            border-radius: 20px;
            padding: 10px;
            margin: 15px;


            box-shadow: 0 4px 6px  black;
                      /* X axis Y axis Spread-radius color */

        }

        div img{
            width: 100%;
            height: 180px;
            object-fit: cover;

           

            border-radius: 20px;
            margin-bottom: 10px;
        }

        div h2{
            font-family: Arial, sans-serif;
            text-decoration: underline;
            color: brown;
            margin-bottom: 15px;
        }

        div p{
            font-size: 20px;
            color: white;
            margin-bottom: 10px;
        }

        div button{
            background-color: orange;
            border: none;
            padding: 10px;
            border-radius: 20px;
        }

        .discount{
            color: blue;
            font-size: 20px;
        }
    </style>
</head>
<body>
   <div class="ecom">

    <div class="product">
        <img src="https://images.pexels.com/photos/33797585/pexels-photo-33797585.jpeg" alt="Mobile" >
        <h2>Mobile</h2>
        <p>Rs 250000   </p>
        <button>Buy Now<span id="logo">📍</span></button>
      
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/7857501/pexels-photo-7857501.jpeg" alt="Shoes">
        <h2>Shoes</h2>
        <p>Rs 5000</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/17743351/pexels-photo-17743351.jpeg" alt="Headphone" >
        <h2>Headphone</h2>
        <p>Rs 2000</p>
        <button>Buy Now</button>
    </div>


     <div class="product">
        <img src="https://images.pexels.com/photos/17743351/pexels-photo-17743351.jpeg" alt="Headphone" >
        <h2>Headphone</h2>
        <p>Rs 2000</p>
        <button>Buy Now</button>
    </div>


    <div class="product">
        <img src="https://images.pexels.com/photos/7857501/pexels-photo-7857501.jpeg" alt="Shoes">
        <h2>Shoes</h2>
        <p>Rs 5000</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/33797585/pexels-photo-33797585.jpeg" alt="Mobile" >
        <h2>Mobile</h2>
        <p>Rs 250000   </p>
        <button>Buy Now<span id="logo">📍</span></button>
      
    </div>

    </div>
</body>
</html>
